services:
  # PostgreSQL 17 Database
  postgres:
    image: postgres:17-alpine
    container_name: asyncflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: asyncflow_production
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asyncflow_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Bus
  redis:
    image: redis:7-alpine
    container_name: asyncflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asyncflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/asyncflow_production?schema=public"
      JWT_SECRET: "asyncflow-production-jwt-secret-key-32chars"
      JWT_REFRESH_SECRET: "asyncflow-production-refresh-secret-key-32chars"
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost"
      REDIS_ENABLED: "true"
      REDIS_URL: "redis://redis:6379"
      UPLOAD_DIR: "./uploads"
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

  # React Vite Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asyncflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  redisdata:
  uploads_data:
